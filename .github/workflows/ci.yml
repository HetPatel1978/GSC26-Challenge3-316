name: CI

"on": push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # torch is deliberately excluded from requirements.txt (needs a
      # hardware-specific index-url, see README Setup) and isn't needed by
      # tests/ -- build_features.py and eval/dataset.py only import
      # polars/numpy, so a plain CPU runner is sufficient here.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
